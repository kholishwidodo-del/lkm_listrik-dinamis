<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LKM Listrik Dinamis</title>
<style>
body{margin:0;font:15px/1.5 system-ui,Arial,sans-serif;background:#eef4ff;color:#10204a}
header{background:linear-gradient(135deg,#0b1a40,#2f6bff);color:#fff;padding:18px 20px}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.85;font-size:13px}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid #cfdcf7;border-radius:12px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:16px;color:#1d4ed8}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #9db7ee;border-radius:8px;font:inherit}
textarea{min-height:64px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
td,th{border:1px solid #cfdcf7;padding:4px}th{background:#e7f1fb;font-size:13px}td input{padding:6px}
button{font:inherit;background:#2f6bff;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600}
button:disabled{opacity:.6}#st{margin:10px 0}
a.b{display:inline-block;background:#16a34a;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;margin:4px 6px 0 0}
footer{text-align:center;font-size:12px;color:#51608a;padding:10px 10px 24px}
</style></head><body>
<header><h1>Lembar Kerja Murid: Listrik Dinamis</h1><p>IPA Kelas IX · Isi LKM setelah bereksperimen di Virtual Electricity Lab</p></header>
<main><form id="f" onsubmit="return false"></form>
<button id="go" type="button">Kirim LKM dan buat PDF</button><div id="st"></div></main>
<footer>Dikembangkan oleh Mohamad Kholish Widodo, S.Pd., M.Pd. – MTsN 1 Kota Malang</footer>
<script>
const P=l=>({t:'a',l}),I=l=>({t:'i',l}),TB=(l,head,rows)=>({t:'tb',l,head,rows});
const Q=(k,a)=>a.map(q=>P('Kegiatan '+k+', '+q));
const HIP=k=>P('Hipotesis Kegiatan '+k+' (pola: Jika …, maka …, karena …)');
const HD=['Komponen','Kuat arus (A)','Tegangan (V)','Hambatan (Ω)'];
const L3=()=>['Lampu 1','Lampu 2','Lampu 3','Baterai (total)'].map(x=>[x,'','','']);
const S=[
 {j:'Identitas Kelompok',items:[I('Nama kelompok'),I('Tanggal pelaksanaan'),
  TB('Anggota',['No.','Nama anggota','No. presensi','Kelas'],[1,2,3,4,5].map(n=>[String(n),'','','']))]},
 {j:'Kegiatan 1: Hukum Ohm',items:[HIP(1),
  TB('Tabel 1. Hambatan tetap R = 100 Ω',['V (volt)','I (ampere)','V / I (ohm)'],[3,6,9,12,15].map(v=>[String(v),'',''])),
  TB('Tabel 2. Tegangan tetap V = 12 volt',['R (ohm)','I (ampere)','I × R (volt)'],[50,100,200,400].map(v=>[String(v),'',''])),
  ...Q(1,['1. Apa yang terjadi pada kuat arus ketika tegangan dinaikkan? Bagaimana bentuk grafik V terhadap I?',
   '2. Berapa nilai V / I pada setiap percobaan di Tabel 1? Apa artinya?',
   '3. Pada Tabel 2, apa yang terjadi pada kuat arus ketika hambatan diperbesar?',
   '4. Apakah hasil I × R pada Tabel 2 selalu sama dengan tegangan sumber? Jelaskan.',
   '5. Mengapa voltmeter dipasang paralel dan amperemeter dipasang seri?'])]},
 {j:'Kegiatan 2: Rangkaian Seri',items:[HIP(2),TB('Tabel 3. Rangkaian seri',HD,L3()),
  I('Keadaan lampu lain setelah satu lampu dilepas'),
  ...Q(2,['1. Bagaimana kuat arus pada setiap lampu? Apa kesimpulanmu?',
   '2. Bagaimana tegangan pada setiap lampu dibandingkan tegangan baterai? Berapa jumlah tegangan ketiga lampu?',
   '3. Apakah hambatan total sama dengan R1 + R2 + R3? Tunjukkan perhitunganmu.',
   '4. Mengapa semua lampu padam ketika satu lampu dilepas?'])]},
 {j:'Kegiatan 3: Rangkaian Paralel',items:[HIP(3),TB('Tabel 4. Rangkaian paralel',HD,L3()),
  I('Kuat arus baterai setelah Lampu 3 dilepas (A)'),
  ...Q(3,['1. Bagaimana tegangan pada setiap lampu dibandingkan tegangan baterai?',
   '2. Apakah kuat arus baterai sama dengan I1 + I2 + I3? Tunjukkan perhitunganmu.',
   '3. Apa yang terjadi pada lampu lain dan pada kuat arus total setelah satu lampu dilepas? Jelaskan.',
   '4. Sebutkan satu perbedaan utama rangkaian seri dan paralel, lalu satu alasan mengapa instalasi listrik rumah dibuat paralel.'])]},
 {j:'Kesimpulan',items:[P('Kesimpulan 1: hubungan V, I, dan R menurut Hukum Ohm'),
  P('Kesimpulan 2: sifat kuat arus dan tegangan pada rangkaian seri'),
  P('Kesimpulan 3: sifat kuat arus dan tegangan pada rangkaian paralel')]},
 {j:'Refleksi Kelompok',items:[P('Bagian yang paling mudah dipahami'),P('Bagian yang masih sulit atau ingin ditanyakan')]}
];
const G=[],F=document.getElementById('f');
S.forEach(s=>{
 const c=document.createElement('section');c.className='card';c.innerHTML='<h2>'+s.j+'</h2>';const gs=[];
 s.items.forEach(it=>{
  if(it.t==='tb'){
   const w=document.createElement('div');w.className='w';
   w.innerHTML='<label>'+it.l+'</label><table><tr>'+it.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
    it.rows.map(r=>'<tr>'+r.map((v,i)=>i?'<td><input></td>':'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table>';
   c.appendChild(w);
   gs.push(()=>({t:'tb',l:it.l,head:it.head,rows:[...w.querySelectorAll('tr')].slice(1)
    .map(tr=>[...tr.children].map((td,i)=>i?td.firstChild.value.trim():td.textContent))}));
  }else{
   const d=document.createElement('div');
   d.innerHTML='<label>'+it.l+'</label>'+(it.t==='a'?'<textarea></textarea>':'<input>');
   c.appendChild(d);const e=d.lastChild;
   gs.push(()=>({t:'p',l:it.l,v:e.value.trim()}));
  }
 });
 F.appendChild(c);G.push(()=>({j:s.j,items:gs.map(g=>g())}));
});
const go=document.getElementById('go'),st=document.getElementById('st');
go.onclick=()=>{
 const p={sections:G.map(g=>g())};
 const kel=p.sections[0].items[0].v,ang=p.sections[0].items[2].rows.filter(r=>r[1]).length;
 if(!kel||!ang){st.textContent='Isi nama kelompok dan minimal satu nama anggota.';return}
 go.disabled=true;st.textContent='Menyimpan ke Google Sheet dan membuat PDF…';
 google.script.run.withSuccessHandler(r=>{
   go.disabled=false;
   const a=document.createElement('a');a.className='b';a.textContent='Unduh PDF';
   a.href='data:application/pdf;base64,'+r.b64;a.download=r.name;
   const b=document.createElement('a');b.className='b';b.textContent='Buka di Drive';b.href=r.url;b.target='_blank';
   st.textContent='LKM tersimpan. ';st.append(a,b);
  }).withFailureHandler(e=>{go.disabled=false;st.textContent='Gagal: '+e.message}).simpanLKM(p);
};
</script></body></html>
